<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Target Page</title>
</head>
<body>
  <h1>Target Page</h1>


  <p>This page displays a message from the URL.</p>


  <div>
    <strong>Search result:</strong>
    <span id="output"></span>
  </div>


  <hr>


  <textarea id="commentBox" rows="4" cols="50"></textarea>
  <br>
  <button id="saveBtn">Save Comment</button>


  <h2>Saved Comments</h2>
  <div id="comments"></div>

  <script>
  /// Retrieves the url
  /// Displays nothing if we don't get a text in the url
    const params = new URLSearchParams(window.location.search);
    const q = params.get("q") || "nothing submitted";


    /// We get the output of it and we use the url as a text file
    document.getElementById("output").textContent = q;

    /// We save and put it in a variable for the commentbox of the page
    /// Saves the comments that the user puts and loads it into a variable
    /// Saves the commentbox into a variable
    /// Saves a variable y which has the message of the memory storage 
    /// We put it in a text file and load it into the commentbox
    const commentsDiv = document.getElementById("comments");
    const saveBtn = document.getElementById("saveBtn");
    const commentBox = document.getElementById("commentBox");
    const savedComments = localStorage.getItem("y") || "";
    commentsDiv.innerHTML = savedComments;

/// After we click the save button into the storage, we document a list of what is needed
    saveBtn.onclick = function () {
      const value = commentBox.value;
      const p = document.createElement("p");

/// Puts the message in the result as a text file
/// Adds this result right below the comments page
      p.textContent = value;
      commentsDiv.appendChild(p);


      // Save html list in the commentbox back to the storage in "y" then clears box for next message
      localStorage.setItem("y", commentsDiv.innerHTML);
      commentBox.value = "";
    };
  </script>
</body>
</html>
